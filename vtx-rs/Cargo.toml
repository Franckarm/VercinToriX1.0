[package]
name = "vtx-spu"
version = "0.5.0"
edition = "2021"
description = "Émulateur du SPU à cube chromatique (Vercintorix, vtx 0.5)"

[[bin]]
name = "vtx-spu"
path = "src/main.rs"

[[bin]]
name = "vtx"
path = "src/vtx.rs"

[[bin]]
name = "atelier"
path = "src/atelier_exe.rs"

[[bin]]
name = "vtx64"
path = "src/vtx64.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
verif_fenetre = []
